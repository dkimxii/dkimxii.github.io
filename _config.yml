# Remote theme directory
remote_theme: analytics-link/analytics-link.github.io

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme

#-------------------------------
# General Site Settings
title: Daniel Kim
description: "Hi I'm Daniel, and I'm a recent graduate from University of Alberta.  My portfolio focuses on interesting projects I've recently undertaken. Please visit my Github & LinkedIn pages (or download my Resume) by using the links below!"
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

#-------------------------------
# About Section
subtitle: Data Science <span style="color:#f58506"> Portfolio </span>
location: "Edmonton, AB"
resume_url: /docs/Daniel_Kim_Resume_071626.pdf
avatar_image: /img/self_crop.jpg

#-------------------------------
# Contact links
linkedln: "https://linkedin.com/in/danielkim03" 
github: "https://github.com/eunoia03"  

paginate: 6
paginate_path: "/page/:num"

sass:
  sass_dir: _sass
  style: compressed # possible values: nested expanded compact compressed

defaults:
  - scope:
      type: posts
    values:
      layout: post
      read_time: true
      share: false


